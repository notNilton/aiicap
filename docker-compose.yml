services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aiicap_postgres
    environment:
      POSTGRES_USER: aiicap
      POSTGRES_PASSWORD: aiicap_secret
      POSTGRES_DB: aiicap
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiicap"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: aiicap_backend
    environment:
      DATABASE_URL: postgresql://aiicap:aiicap_secret@postgres:5432/aiicap
      IMAGE_GENERATOR_URL: http://image_generator:8001
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages/shared:/app/packages/shared
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # Image Generator Service
  image_generator:
    build:
      context: .
      dockerfile: apps/image_generator/Dockerfile
    container_name: aiicap_image_generator
    environment:
      DATABASE_URL: postgresql://aiicap:aiicap_secret@postgres:5432/aiicap
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-api-key-here}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./apps/image_generator:/app/apps/image_generator
      - ./packages/shared:/app/packages/shared
      - uploads_data:/app/uploads
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload

  # Frontend
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: aiicap_frontend
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    command: npm run dev -- --host

volumes:
  postgres_data:
  uploads_data:
