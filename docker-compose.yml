version: "3.8"

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aiicap
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d aiicap"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/aiicap
      - USE_DATABASE=true
    depends_on:
      db:
        condition: service_healthy

  generator:
    build:
      context: ./services/generator
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/aiicap
      - USE_DATABASE=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SIMULATION_MODE=${SIMULATION_MODE:-false}
    depends_on:
      db:
        condition: service_healthy

  corrector:
    build:
      context: ./services/corrector
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/aiicap
      - USE_DATABASE=true
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
