services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: aiicap_postgres
    environment:
      POSTGRES_USER: aiicap
      POSTGRES_PASSWORD: aiicap_secret
      POSTGRES_DB: aiicap
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiicap"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aiicap_backend
    environment:
      DATABASE_URL: postgresql://aiicap:aiicap_secret@postgres:5432/aiicap
      IMAGE_GENERATOR_URL: http://image-generation:8001
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend:/app/backend
      - ./packages/shared:/app/packages/shared
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # Image Generator Service
  image-generation:
    build:
      context: .
      dockerfile: image-generation/Dockerfile
    container_name: aiicap_image_generation
    environment:
      DATABASE_URL: postgresql://aiicap:aiicap_secret@postgres:5432/aiicap
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-api-key-here}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./image-generation:/app/image-generation
      - ./packages/shared:/app/packages/shared
      - uploads_data:/app/uploads
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload

  # MinIO (S3 Compatible Storage)
  minio:
    image: minio/minio
    container_name: aiicap_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Setup (Create Bucket)
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/aiicap-uploads;
      /usr/bin/mc policy set public myminio/aiicap-uploads;
      exit 0;
      "

  # Web Application
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: aiicap_webapp
    volumes:
      - ./webapp:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    command: npm run dev -- --host

volumes:
  postgres_data:
  uploads_data:
  minio_data:
