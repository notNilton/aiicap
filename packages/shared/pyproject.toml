[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiicap-shared"
version = "1.0.0"
description = "Shared modules for AIICAP monorepo"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0.0",
    "psycopg2-binary",
    "python-dotenv",
    "Pillow",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["database*", "storage*", "common*"]
