[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiicap"
version = "2.0.0"
description = "AI Image Correction and Processing - Monorepo"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = [
    "apps/backend/tests",
    "apps/image_generator/tests",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
